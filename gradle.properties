org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
# Apple compilation is a separate gate, never implied by a passing JVM test.
enableAppleTargets=false
# Robolectric's Android-only test runtime uses AndroidX monitor; no production AndroidX dependency is added.
android.useAndroidX=true

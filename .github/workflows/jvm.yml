name: JVM shared contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jvm.yml'
      - 'canvas-core/**'
      - 'android-app/**'
      - 'shared-core/**'
      - 'fixtures/**'
      - 'tools/**'
      - 'ci/verify.sh'
      - 'ci/gradle_download_retry.py'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'gradlew'

permissions:
  contents: read

concurrency:
  group: jvm-contracts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Cache pinned Gradle downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .gradle-user-home/wrapper/dists
            .gradle-user-home/caches/modules-2
            !.gradle-user-home/caches/modules-2/modules-2.lock
            !.gradle-user-home/caches/modules-2/gc.properties
          key: jvm-android-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Select bundled JDK 17
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Verify current shared contracts and source bindings
        run: |
          mkdir -p build/jvm-ci
          git rev-parse HEAD > build/jvm-ci/commit.txt
          bash ci/verify.sh > build/jvm-ci/verification.log 2>&1
      - name: Compile and test current Android App adapter
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          PYTHONPATH=ci python3 - <<'PY'
          from pathlib import Path
          from gradle_download_retry import run_gradle

          run_gradle([
              './gradlew', '--no-daemon', '--console=plain', '-PenableAndroidTargets=true',
              ':android-app:compileDebugKotlin', ':android-app:testDebugUnitTest',
          ], Path.cwd(), Path('build/jvm-ci/android-app.log'), 900, retry_delay=30)
          PY
      - name: Compile independent Java calls against current JVM classes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          platforms = list((pathlib.Path(os.environ['ANDROID_HOME']) / 'platforms').glob('android-*/android.jar'))
          platforms = [p for p in platforms if all(part.isdigit() for part in p.parent.name[8:].split('.'))]
          assert platforms, 'No Android compile stubs installed on this runner'
          android = max(platforms, key=lambda p: tuple(map(int, p.parent.name[8:].split('.'))))
          stdlibs = list(pathlib.Path(os.environ['GRADLE_USER_HOME']).glob('caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/2.2.21/*/kotlin-stdlib-2.2.21.jar'))
          assert len(stdlibs) == 1, 'Expected the actual build Kotlin stdlib'
          classes = [root / module / 'build/classes/kotlin/jvm/main' for module in ('canvas-core', 'shared-core')]
          assert all(p.is_dir() for p in classes), 'Missing real JVM compilation outputs'
          source = root / 'tools/probes/C1AndroidFailureConsumer.java'
          output = root / 'build/jvm-ci/java-consumer'
          output.mkdir()
          subprocess.run([str(pathlib.Path(os.environ['JAVA_HOME']) / 'bin/javac'), '--release', '8',
              '-cp', os.pathsep.join(map(str, [android, *classes, stdlibs[0]])), '-d', str(output), str(source)], check=True)
          receipt = {'status': 'compiled', 'scope': 'Independent Java source signatures against current JVM classes and Android compile stubs; no AAR/DEX/ART or device runtime claim',
              'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(), 'android_compile_stubs': str(android),
              'art_runtime_verified': False}
          (root / 'build/jvm-ci/java-consumer.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Retain source-bound results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jvm-contracts-${{ github.sha }}
          path: |
            build/jvm-ci/**
            reports/verification.json
            reports/gradle-verification.sha256
            android-app/build/test-results/testDebugUnitTest/TEST-*.xml
            canvas-core/build/test-results/jvmTest/TEST-*.xml
            shared-core/build/test-results/jvmTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

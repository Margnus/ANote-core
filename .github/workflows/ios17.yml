name: Minimum iOS17 App and SDK verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios17.yml'
      - 'ci/prepare_ios17.py'
      - 'ci/apple_runtime.py'
      - 'ci/test_apple_runtime.py'
      - 'ci/verify_apple_candidate.py'
      - 'ci/verify_apple_sdk.py'
      - 'tools/verify_c1_apple_failure_channels.py'
      - 'tools/probes/C1AppleFailureConsumer.swift'
      - 'canvas-core/**'
      - 'shared-core/**'
      - 'ios-app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      NOTECORE_REQUIRED_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-17-5
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Acquire and boot requested iOS17 runtime
        run: python3 ci/prepare_ios17.py
      - name: Select bundled JDK 17
        run: |
          test -x "$JAVA_HOME_17_arm64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_arm64/bin" >> "$GITHUB_PATH"
      - name: Verify exact runtime selection and evidence checks
        run: python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Verify independent current SDK on requested iOS17
        run: python3 ci/verify_apple_sdk.py
      - name: Verify original App host and ordinary UI on requested iOS17
        run: python3 ci/verify_apple_candidate.py
      - name: Retain actual runtime results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios17-verification-${{ github.sha }}
          path: |
            build/ios17-preflight/**
            build/apple-sdk-current/**
            build/apple-candidate/*.json
            build/apple-candidate/*.log
            build/apple-candidate/*.ncp
            build/apple-candidate/ui-attachments/**
          if-no-files-found: error
          retention-days: 14

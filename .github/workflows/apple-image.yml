name: Apple image capability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-image.yml'
      - 'ci/collect_apple_image.py'
      - 'tools/probes/ImageCapabilityProbe.swift'
      - 'fixtures/image-orientation/**'

permissions:
  contents: read

concurrency:
  group: apple-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Collect metadata and native images
        run: python3 ci/collect_apple_image.py
      - name: Retain observations, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-image-${{ github.sha }}
          path: |
            build/apple-image/*.json
            build/apple-image/*.log
            build/apple-image/*.png
          if-no-files-found: error
          retention-days: 14

name: Apple candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-candidate.yml'
      - 'ci/verify_apple_candidate.py'
      - 'canvas-core/**'
      - 'shared-core/**'
      - 'ios-app/**'
      - 'fixtures/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'tools/verify_ios_host.py'

permissions:
  contents: read

concurrency:
  group: apple-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select bundled JDK 17
        run: |
          test -x "$JAVA_HOME_17_arm64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_arm64/bin" >> "$GITHUB_PATH"
      - name: Build and test current Apple candidate
        run: python3 ci/verify_apple_candidate.py
      - name: Retain evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-candidate-${{ github.sha }}
          path: |
            build/apple-candidate/*.json
            build/apple-candidate/*.log
          if-no-files-found: error
          retention-days: 14
